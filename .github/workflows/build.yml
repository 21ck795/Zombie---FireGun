name: 打包Windows exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 安装依赖
      run: |
        pip install pyinstaller selenium webdriver-manager
    
    - name: 打包 exe
      run: |
        pyinstaller -F -n 批量签到 --clean --collect-all selenium --collect-all webdriver_manager auto_sign.py
    
    - name: 上传产物
      uses: actions/upload-artifact@v4
      with:
        name: 批量签到.exe
        path: dist/批量签到.exe
